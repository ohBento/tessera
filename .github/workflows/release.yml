name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run tauri build

      - name: Package portable
        run: |
          mkdir portable
          copy src-tauri\target\release\tessera.exe portable\Tessera.exe
          copy LICENSE portable\
          copy README.md portable\
          Compress-Archive -Path portable\* -DestinationPath Tessera-portable.zip

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            Tessera-portable.zip
            src-tauri/target/release/bundle/nsis/*-setup.exe
